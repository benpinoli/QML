[experiment]
name = "periodic-function-mse-k3-zero-offset"
protocol_version = "0.1.0"
comparison_group = "periodic-function-mse-k3-zero-offset-components-ry-angle-encoding-z1-readout"
description = "Zero-intercept periodic target with three distinct non-DC Fourier frequencies."

[encoding]
name = "ry-angle-period-one"
domain = "[0, 1) with period 1"
wire = 0
angle = "2*pi*x"

[data]
seed = 314159
train_size = 64
validation_size = 128
test_size = 512
target_offset = 0.0
target_frequency = 1
target_components = [[1, 0.55, 0.25], [2, 0.16, 0.08], [3, 0.10, 0.05]]

[model]
qubits = 2
ansatz = "qft2_trainable_u_cp_u_swap"
readout_wire = 1
readout = "Pauli-Z expectation on qubit 1"
initialization = "uniform[-pi, pi]"

[optimizer]
name = "L-BFGS-B"
max_iterations = 500
ftol = 1e-12
gtol = 1e-8

[tracking]
mode = "auto"
experiment_name = "periodic-function-mse-components-3-zero-offset"

[output]
root = "results/runs"
