[experiment]
name = "periodic-function-mse-zero-offset-multidataset"
protocol_version = "0.1.0"
comparison_group = "periodic-function-mse-zero-offset-multidataset-ry-angle-encoding-z1-readout"
description = "Zero-intercept single-frequency target evaluated over independent fabricated data splits and randomized circuit initializations."

[encoding]
name = "ry-angle-period-one"
domain = "[0, 1) with period 1"
wire = 0
angle = "2*pi*x"

[data]
seed = 8675309  # Overridden per dataset by --data-seeds; recorded in every run bundle.
train_size = 64
validation_size = 128
test_size = 512
target_frequency = 1
target_offset = 0.0
target_cosine = 0.55
target_sine = 0.25

[model]
qubits = 2
ansatz = "qft2_trainable_u_cp_u_swap"
readout_wire = 1
readout = "Pauli-Z expectation on qubit 1"
initialization = "uniform[-pi, pi]"

[optimizer]
name = "L-BFGS-B"
max_iterations = 500
ftol = 1e-12
gtol = 1e-8

[tracking]
mode = "auto"
experiment_name = "periodic-function-mse-zero-offset-multidataset"

[output]
root = "results/runs"
